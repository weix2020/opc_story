name: 数据一致性检查

on:
  push:
    paths:
      - 'site/report/**'
      - 'site/data/**'
      - 'site/index.html'
      - 'site/all.html'
      - 'site/llms.txt'
      - 'site/llms-full.txt'
      - 'site/feed.json'
      - 'site/sitemap.xml'
      - 'site/insights/**'
      - 'scripts/**'
      - '.github/workflows/data-check.yml'
  pull_request:
    paths:
      - 'site/report/**'
      - 'site/data/**'
      - 'site/index.html'
      - 'site/all.html'
      - 'site/llms.txt'
      - 'site/llms-full.txt'
      - 'site/feed.json'
      - 'site/sitemap.xml'
      - 'site/insights/**'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    # 每周一 09:00（北京时间）跑一次全量检查
    - cron: '0 1 * * 1'

concurrency:
  group: data-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 校验 cases.json 与全部案例报告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 重建派生数据（bi.json / feed.json / 信源台账）
        run: |
          node scripts/build-source-ledger.js
          node scripts/build-bi.js
          node scripts/build-feed.js

      - name: 校验派生数据无漂移
        run: |
          set -o pipefail
          git diff --exit-code -- site/data/bi.json site/data/sources.json site/feed.json || {
            echo '::error::派生数据与源数据不一致，请重新运行 build-bi.js / build-source-ledger.js / build-feed.js'
            exit 1
          }

      - name: 运行检查
        run: |
          set -o pipefail
          node scripts/check-data-consistency.js --strict | tee /tmp/check.log

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo '## 数据一致性检查'
            echo ''
            echo '```'
            head -c 20000 /tmp/check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
