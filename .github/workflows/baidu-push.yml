name: 百度主动推送

on:
  # 只保留定时与手动触发：push 触发会白白消耗每日配额
  workflow_dispatch:
    inputs:
      limit:
        description: '本次推送条数上限（百度新站每日配额 10 条）'
        required: false
        default: '10'
  schedule:
    # 每天 UTC 22:10（北京时间 06:10）推送当日配额。
    # GitHub Actions 的 cron 触发常有数小时延迟（实测首次触发延迟约 8 小时），
    # 故把目标时间提前到早晨，留出缓冲，避免延迟后跨过北京时间日切
    # （配额按北京时间 00:00 重置，跨日会导致刚推完就判定为「今日已用尽」）。
    - cron: '10 22 * * *'

concurrency:
  group: baidu-push
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  push:
    name: 向百度站长提交 sitemap 中的新 URL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 备份仓库中的推送状态
        run: cp .baidu-push-state.json /tmp/state-repo.json

      - name: 恢复推送进度
        uses: actions/cache/restore@v4
        with:
          path: .baidu-push-state.json
          key: baidu-push-state-${{ github.run_id }}
          restore-keys: |
            baidu-push-state-

      - name: 合并仓库与缓存中的推送状态
        run: |
          # cache 的 restore-keys 回溯命中的是「最近创建」的条目，可能比仓库里
          # 回写的状态更旧（例：仓库已记 20 条，缓存仍是 10 条）。若直接以缓存
          # 覆盖仓库状态，会重复提交已推过的 URL、白白浪费每日配额。
          # 故以仓库状态为基准，取两者的并集：既不丢已推记录，也不重复提交。
          set -o pipefail
          node scripts/merge-push-state.js /tmp/state-repo.json .baidu-push-state.json

      - name: 推送
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
          PUSH_LIMIT: ${{ inputs.limit || '10' }}
        run: |
          set -o pipefail
          node scripts/baidu-push.js --limit "$PUSH_LIMIT" | tee /tmp/push.log

      - name: 持久化推送进度
        if: always()
        run: |
          # 无状态文件时补一个空壳，保证 cache/save 不因缺文件而失败
          [ -f .baidu-push-state.json ] || echo '{"pushed":[],"dates":{}}' > .baidu-push-state.json

      - name: 写入缓存
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .baidu-push-state.json
          key: baidu-push-state-${{ github.run_id }}

      - name: 生成站内进度数据
        if: always()
        run: node scripts/build-push-status.js

      - name: 回写推送状态与进度数据
        if: always()
        continue-on-error: true
        run: |
          # 状态文件与站内进度数据回写仓库，站点上的「收录进度」页随之自动更新。
          # 回写失败不影响本次推送结果，故 continue-on-error。
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .baidu-push-state.json site/data/push-status.json
          if git diff --staged --quiet; then
            echo "无变化，无需提交。"
            exit 0
          fi
          git commit -m "chore: 更新百度主动推送进度 $(date -u +%Y-%m-%d)"
          # 期间可能有其它提交，rebase 后再推
          git pull --rebase origin main
          git push origin HEAD:main

      - name: 写入 Job Summary
        if: always()
        run: |
          {
            echo '## 百度主动推送'
            echo ''
            echo '```'
            head -c 20000 /tmp/push.log
            echo '```'
            echo ''
            echo '### 当前进度'
            echo ''
            echo '```'
            node scripts/baidu-push.js --status || echo '(状态读取失败)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
