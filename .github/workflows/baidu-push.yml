name: Baidu Push

on:
  push:
    paths:
      - '.github/workflows/baidu-push.yml'
  workflow_dispatch:
  schedule:
    # 每周一 09:00（北京时间）跑一次全量检查
    - cron: '0 1 * * 1'

concurrency:
  group: baidu-push
  cancel-in-progress: true

jobs:
  check:
    name: 校验 cases.json 与全部案例报告
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 推送
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: node scripts/baidu-push.js
