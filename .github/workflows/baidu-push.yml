name: 百度主动推送

on:
  push:
    paths:
      - 'site/sitemap.xml'
      - 'scripts/baidu-push.js'
      - '.github/workflows/baidu-push.yml'
  schedule:
    # 每天 08:10（北京时间）推送一次，配合百度普通收录的每日配额重置
    - cron: '10 0 * * *'
  workflow_dispatch:

concurrency:
  group: baidu-push
  cancel-in-progress: false

jobs:
  push:
    name: 提交 sitemap URL 到百度站长
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 推送
        env:
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: node scripts/baidu-push.js
