<style>
/* ===== OPC CASE WALL · 方案 B 暗黑终端风 ===== */
:root{--bg:#0a0e14;--card:#111823;--line:#1e2a3a;--line2:#26334a;--txt:#e6edf3;--sub:#9fb0c5;--dim:#7d8ca3;--faint:#5a6a80;--cyan:#58a6ff;--gold:#c9a961;--green:#3fd68f;--red:#ff6b63;--mono:ui-monospace,Menlo,"SF Mono",Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Source Han Sans CN",-apple-system,sans-serif;background:var(--bg);color:var(--sub);line-height:1.75;font-size:15px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 80px}

/* Hero */
.hero{background:linear-gradient(135deg,#0a0e14 0%,#101821 55%,#1a2332 100%);border-bottom:1px solid var(--line);color:var(--txt);padding:58px 24px 46px;text-align:center}
.hero-inner{max-width:1080px;margin:0 auto}
.hero .meta{font-family:var(--mono);font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan);margin-bottom:20px}
.hero h1{font-size:38px;font-weight:800;letter-spacing:1px;line-height:1.25;margin-bottom:14px;color:var(--txt)}
.hero h2{font-size:16.5px;font-weight:400;color:var(--dim);letter-spacing:.5px;margin-bottom:26px;line-height:1.7}
.hero h2 b{color:var(--gold);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tag{border:1px solid var(--line2);border-radius:4px;padding:4px 15px;font-size:12px;color:#8fa3bd;font-family:var(--mono)}

/* 筛选条 */
.opc-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0}
.opc-search{flex:1;min-width:220px;background:#0d1420;border:1px solid var(--line2);border-radius:6px;padding:9px 16px;font-size:14px;font-family:inherit;color:var(--txt);outline:none;transition:border-color .15s}
.opc-search:focus{border-color:var(--cyan)}
.opc-search::placeholder{color:var(--faint)}
.filter-sep{font-size:12px;color:var(--faint);margin-left:4px;font-family:var(--mono)}
.fbtn{border:1px solid var(--line2);background:#0d1420;border-radius:6px;padding:5px 14px;font-size:12.5px;color:#8fa3bd;cursor:pointer;font-family:inherit;transition:all .15s}
.fbtn:hover{border-color:var(--cyan);color:var(--txt)}
.fbtn.is-active{background:var(--cyan);border-color:var(--cyan);color:#0a0e14;font-weight:600}
.opc-count{font-size:12px;color:var(--faint);margin-left:auto;font-family:var(--mono)}
.opc-filters:first-of-type{margin-top:6px}
.opc-filters + .opc-filters{margin-bottom:18px}

/* 卡片流 */
.opc-grid{display:flex;flex-direction:column;gap:13px;max-width:880px;margin:18px auto 0}
.opc-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 17px 13px;display:flex;flex-direction:column;gap:7px;transition:border-color .18s ease,transform .18s ease}
.opc-card:hover{border-color:var(--cyan);transform:translateX(3px)}
.oc-top{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--mono);font-size:11px;margin-bottom:3px}
.oc-time{color:var(--gold);letter-spacing:.3px}
.oc-title{font-size:15.5px;line-height:1.5;color:var(--txt);font-weight:700;margin:0}
.oc-title a{color:var(--txt);text-decoration:none;transition:color .15s}
.oc-title a:hover{color:var(--cyan)}
.oc-founder{font-size:12.5px;color:var(--dim);margin:0}
.oc-founder b{color:#a8b8cc;font-weight:600}
.oc-desc{font-size:13.5px;color:var(--sub);margin:0;flex:1}
.oc-result{font-size:12.5px;color:var(--green);font-family:var(--mono);margin:0;line-height:1.6}
.oc-result:before{content:"▸ "}
.oc-metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.oc-metric{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#0d1420;border-radius:5px;padding:2px 9px;font-size:11.5px;font-family:var(--mono);color:#a8b8cc;white-space:nowrap}
.oc-metric i{font-style:normal;font-size:10.5px;color:var(--faint);letter-spacing:.5px}
.oc-metric.rev{color:var(--green);border-color:#233f31}
.oc-metric.rev i{color:#4a7a61}
.rp-badge{position:relative;display:inline-flex;align-items:center;gap:3px;margin-left:9px;padding:3px 10px;border:1px solid var(--gold);border-radius:4px;color:#ffe9b8;font-size:11px;font-family:var(--mono);font-weight:700;letter-spacing:1px;vertical-align:2px;text-decoration:none;line-height:1.35;overflow:hidden;background:linear-gradient(135deg,rgba(201,169,97,.32),rgba(201,169,97,.06) 58%,rgba(201,169,97,.26));transition:all .18s ease;animation:rpPulse 2s ease-in-out infinite}
.rp-badge::before{content:"";position:absolute;top:0;left:-140%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-18deg);animation:rpShine 2.6s ease-in-out infinite}
.rp-badge svg{position:relative;width:10px;height:10px;transition:transform .18s ease}
.rp-badge:hover{background:var(--cyan);border-color:var(--cyan);color:#0a0e14;animation:none;transform:translateY(-1px);box-shadow:0 0 18px rgba(88,166,255,.6)}
.rp-badge:hover::before{animation:none;opacity:0}
.rp-badge:hover svg{transform:translateX(3px)}
@keyframes rpPulse{0%,100%{border-color:#7d6a3c;box-shadow:0 0 0 rgba(201,169,97,0);text-shadow:none}50%{border-color:var(--gold);box-shadow:0 0 14px rgba(201,169,97,.6);text-shadow:0 0 7px rgba(201,169,97,.7)}}
@keyframes rpShine{0%{left:-140%}55%{left:140%}100%{left:140%}}

/* 深度报告抽屉：从右侧浮现 */
.rp-modal{position:fixed;inset:0;z-index:99;display:flex;justify-content:flex-end;background:rgba(3,7,12,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:rpFade .22s ease}
.rp-modal[hidden]{display:none}
.rp-panel{position:relative;display:flex;flex-direction:column;width:min(1000px,94vw);height:100vh;background:#0a0e14;border-left:1px solid var(--line2);overflow:hidden;box-shadow:-24px 0 80px rgba(0,0,0,.6);animation:rpSlideIn .3s cubic-bezier(.22,.9,.3,1)}
.rp-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--gold);letter-spacing:1px;flex-shrink:0}
.rp-close{margin-left:auto;flex-shrink:0;border:1px solid var(--line2);background:#0d1420;color:#8fa3bd;border-radius:5px;padding:3px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s}
.rp-close:hover{border-color:var(--red);color:var(--red)}
.rp-frame{flex:1;border:0;width:100%;background:#fafbfc}
@keyframes rpFade{from{opacity:0}to{opacity:1}}
@keyframes rpSlideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}

      </div>
      <div class="oc-foot">
        <span class="oc-cats">${GROUP_LABEL[c.g]}</span>
        <div class="oc-actions">
          <span class="op-views" title="阅读量：点击本项目卡片累计（仅保存在本机）">${EYE} <b data-vc>0</b></span>
          <button type="button" class="op-btn" data-like="${c.r}" aria-pressed="false" title="点赞（仅保存在本机）">${HEART} <b data-lc>0</b></button>
          <button type="button" class="op-btn" data-share="${c.r}" title="分享到微信 / 朋友圈 / 小红书 / 微博">${SHARE} <b data-sc>0</b></button>
        </div>
      </div>
    </article>`;
  }).join('');
}

/* ===== 全站互动计数（Pages Function + D1；接口不可用时降级为本机计数）===== */
const lsGet = k => { try { return window.localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { window.localStorage.setItem(k,v); } catch {} };
const BY_R = Object.fromEntries(CASES.map(c => [c.r, c]));

/* 访客 ID：服务端按它去重（点赞终身一次、阅读/分享每天一次） */
const VID = (() => {
  let v = lsGet('opc:vid');
  if (!v || !/^[A-Za-z0-9-]{8,64}$/.test(v)) {
    v = crypto.randomUUID ? crypto.randomUUID() : 'v' + Date.now() + Math.random().toString(36).slice(2, 10);
    lsSet('opc:vid', v);
  }
  return v;
})();

let CNT = {};      // slug -> {view, like, share} 全站计数缓存
let LIVE = false;  // 计数接口是否可用（否则走本机降级）
const C = slug => (CNT[slug] || (CNT[slug] = { view: 0, like: 0, share: 0 }));
const likedOf = slug => lsGet('opc:liked:' + slug) === '1';

function paintCounts(r) {
  const card = document.getElementById('case-' + r);
  const c = BY_R[r];
  if (!card || !c) return;
  const v = C(c.s), liked = likedOf(c.s);
  const likeBtn = card.querySelector('[data-like]');
  likeBtn.classList.toggle('liked', liked);
  likeBtn.setAttribute('aria-pressed', liked ? 'true' : 'false');
  likeBtn.querySelector('[data-lc]').textContent = v.like;
  card.querySelector('[data-vc]').textContent = v.view;
  card.querySelector('[data-sc]').textContent = v.share;
}
function repaintAll() { CASES.forEach(c => paintCounts(c.r)); }

/* 拉取全站计数；失败时退回本机缓存，保证本地预览/离线仍可用 */
async function loadCounts() {
  try {
    const res = await fetch('/api/count?slugs=' + encodeURIComponent(CASES.map(c => c.s).join(',')), { cache: 'no-store' });
    const j = await res.json();
    if (!res.ok || !j.ok) throw new Error('bad response');
    Object.assign(CNT, j.data || {});
    LIVE = true;
  } catch {
    LIVE = false;
    CASES.forEach(c => {
      CNT[c.s] = {
        view: parseInt(lsGet('opc:view:' + c.s) || '0', 10),
        like: likedOf(c.s) ? 1 : 0,
        share: parseInt(lsGet('opc:share:' + c.s) || '0', 10),
      };
    });
  }
  repaintAll();
}

/* 计数变更：先本地乐观更新，再异步写服务端；返回后以服务端值为准 */
async function bump(c, kind, delta = 1) {
  if (!c) return;
  const v = C(c.s);
  v[kind] = Math.max(0, (v[kind] || 0) + delta);
  paintCounts(c.r);
  if (!LIVE) { lsSet('opc:' + kind + ':' + c.s, String(v[kind])); return; }
  try {
    const res = await fetch('/api/count', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slug: c.s, kind, vid: VID, delta }),
    });
    const j = await res.json();
    if (j && j.ok && j.data) { CNT[c.s] = j.data; paintCounts(c.r); }
  } catch {}
}

function bindActions() {
  document.getElementById('opcGrid').addEventListener('click', (e) => {
    /* 阅读量：点击卡片主体（标题/简介区）= 点击该项目 */
    const main = e.target.closest('.oc-main');
    if (main) bump(BY_R[main.closest('.opc-card').dataset.r], 'view');
    const likeBtn = e.target.closest('[data-like]');
    const shareBtn = e.target.closest('[data-share]');
    if (likeBtn) {
      const c = BY_R[likeBtn.dataset.like];
      const liked = likedOf(c.s);
      lsSet('opc:liked:' + c.s, liked ? '0' : '1');   // 点赞可切换
      bump(c, 'like', liked ? -1 : 1);
    } else if (shareBtn) {
      openShareMenu(shareBtn);           // 打开四通道分享菜单
    }
  });
}

/* ===== 分享菜单：微信 / 朋友圈 / 小红书 / 微博 ===== */
const shareDataOf = r => {
  const c = CASES.find(x => x.r === Number(r));
  return { c, url: location.href.split('#')[0] + '#case-' + r };
};
/* 收入口径：rv 为元（月收入已年化），无 rv 时如实标注未披露 */
const revText = (c) => {
  if (!c.rv) return '营收未披露';
  const parts = (c.rn || '营收').split('·');
  const main = parts.shift();
  const note = parts.length ? `（${parts.join('·')}）` : '';
  if (c.rv >= 10000) {
    const w = c.rv / 10000;
    return `${main}约 ${w >= 100 ? Math.round(w) : Math.round(w * 10) / 10} 万元${note}`;
  }
  return `${main}约 ${c.rv} 元${note}`;
};
const cut = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);
/* 小红书：多行结构化文案，含项目/创业者/产品/收入 */
const xhsText = (c, url) => [
  `📕 一人公司案例｜${c.n}`,
  '',
  `👤 创业者：${c.f}`,
  `🧩 产品：${c.d}`,
  `💰 收入：${revText(c)}`,
  c.u ? `📈 用户：${c.u.toLocaleString('en-US')} ${c.un || ''}` : '',
  '',
  '📖 完整拆解（含信源核验）：',
  url,
  '',
  '#AI创业 #一人公司 #OPC #独立开发 #副业',
].filter(Boolean).join('\n');
/* 微博：单行紧凑版，含项目/创业者/产品/收入；链接由 share.php 的 url 参数单独渲染，避免重复 */
const weiboText = (c) =>
  `【${cut(c.n, 26)}】创业者：${cut(c.f, 18)}｜产品：${cut(c.d, 34)}｜收入：${revText(c)}`;
const shMenu = document.getElementById('shMenu');
const shToast = document.getElementById('shToast');
let shToastTimer = null;
function showToast(msg) {
  shToast.textContent = msg;
  shToast.hidden = false;
  clearTimeout(shToastTimer);
  shToastTimer = setTimeout(() => { shToast.hidden = true; }, 2400);
}
function incShare(r) {
  bump(BY_R[Number(r)], 'share');
}
function openShareMenu(btn) {
  const r = btn.dataset.share;
  const { c } = shareDataOf(r);
  shMenu.dataset.r = r;
  shMenu.innerHTML = `
    <div class="shm-title">分享「${c.n}」</div>
    <button type="button" data-ch="wechat">💬 微信 · 扫码转发</button>
    <button type="button" data-ch="moments">🌞 朋友圈 · 扫码分享</button>
    <button type="button" data-ch="xhs">📕 小红书 · 复制文案</button>
    <button type="button" data-ch="weibo">🔥 微博 · 打开分享页</button>
    <button type="button" data-ch="copy">🔗 复制链接</button>
    <div class="shm-qr" hidden><img alt="分享二维码"><p class="shm-hint"></p></div>`;
  shMenu.hidden = false;
  /* 定位：菜单底边贴住按钮顶部，水平方向夹在视口内 */
  const rect = btn.getBoundingClientRect();
  const mw = shMenu.offsetWidth;
  shMenu.style.left = Math.min(Math.max(8, rect.left - mw / 2), window.innerWidth - mw - 8) + 'px';
  shMenu.style.top = Math.max(8, rect.top - 10) + 'px';
  shMenu.style.transform = 'translateY(-100%)';
}
shMenu.addEventListener('click', (e) => {
  const item = e.target.closest('button[data-ch]');
  if (!item) return;
  const r = shMenu.dataset.r;
  const { c, url } = shareDataOf(r);
  const enc = encodeURIComponent;
  const ch = item.dataset.ch;
  if (ch === 'wechat' || ch === 'moments') {
    /* 微信/朋友圈无网页直发通道，标准做法：二维码扫码 → 手机端转发/分享 */
    const qr = shMenu.querySelector('.shm-qr');
    const img = qr.querySelector('img');
    img.src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=${enc(url)}`;
    img.onerror = () => { qr.querySelector('.shm-hint').textContent = '二维码生成失败（需联网），可复制链接后手动打开'; };
    qr.querySelector('.shm-hint').textContent = ch === 'wechat'
      ? '微信扫码打开本案例 → 右上角「…」转发给好友或群聊'
      : '朋友圈无网页直发通道：微信扫码打开后 → 右上角「…」分享到朋友圈';
    qr.hidden = false;
    incShare(r);
  } else if (ch === 'xhs') {
    navigator.clipboard?.writeText(xhsText(c, url))
      .then(() => showToast('小红书文案已复制（含项目/创业者/产品/收入）'))
      .catch(() => showToast('复制失败，请手动复制链接'));
    incShare(r);
    shMenu.hidden = true;
  } else if (ch === 'weibo') {
    window.open(`https://service.weibo.com/share/share.php?title=${enc(weiboText(c))}&url=${enc(url)}`, '_blank', 'noopener');
    incShare(r);
    shMenu.hidden = true;
  } else if (ch === 'copy') {
    navigator.clipboard?.writeText(url)
      .then(() => showToast('链接已复制'))
      .catch(() => showToast('复制失败'));
    shMenu.hidden = true;
  }
});
/* 点击菜单外区域关闭（分享按钮本身除外） */
document.addEventListener('click', (e) => {
  if (!shMenu.hidden && !shMenu.contains(e.target) && !e.target.closest('[data-share]')) shMenu.hidden = true;
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') shMenu.hidden = true; });

/* ===== 搜索 + 赛道筛选 ===== */
let keyword = '', group = '';
function applyFilter() {
  const cards = document.querySelectorAll('.opc-card');
  let visible = 0;
  cards.forEach(card => {
    const okGroup = !group || card.dataset.g === group;
    const okKey = !keyword || card.dataset.key.toLowerCase().includes(keyword);
    const show = okGroup && okKey;
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('opcCount').textContent = `共 ${visible} 个案例`;
  document.getElementById('opcEmpty').style.display = visible ? 'none' : 'block';
}
function bindFilters() {
  document.getElementById('opcSearch').addEventListener('input', (e) => {
    keyword = e.target.value.trim().toLowerCase();
    applyFilter();
  });
  /* 仅绑定赛道筛选按钮（.sort 排序按钮有自己的事件处理） */
  document.querySelectorAll('.fbtn[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fbtn[data-group]').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      group = btn.dataset.group;
      applyFilter();
    });
  });
}

/* ===== 排序（默认按收入降序；收入缺失的项目排末尾）===== */
function metricOf(key, r) {
  const c = BY_R[r];
  const v = c && CNT[c.s];
  if (!v) return 0;
  return key === 'likes' ? v.like : key === 'shares' ? v.share : v.view;
}
function sortCards(key) {
  const grid = document.getElementById('opcGrid');
  let order;
  if (key === 'time') {
    order = CASES.map(c => c.r);
  } else if (key === 'revenue' || key === 'users') {
    const get = key === 'revenue' ? (c => c.rv || -1) : (c => c.u || -1);
    order = [...CASES].sort((a, b) => get(b) - get(a) || (b.rv || -1) - (a.rv || -1) || (b.u || -1) - (a.u || -1) || a.r - b.r).map(c => c.r);
  } else {
    order = [...CASES].sort((a, b) => metricOf(key, b.r) - metricOf(key, a.r)).map(c => c.r);
  }
  order.forEach(r => grid.appendChild(document.getElementById('case-' + r)));
}
function bindSort() {
  document.querySelectorAll('.fbtn.sort').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.fbtn.sort').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      sortCards(btn.dataset.sort);
    });
  });
}

/* ===== 初始化 ===== */
render();
CASES.forEach(c => paintCounts(c.r));
bindActions();
bindFilters();
bindSort();
sortCards('revenue');   // 默认按收入降序
applyFilter();
loadCounts();          // 全站计数（异步拉取，失败自动降级）

/* ===== 深度报告浮层：点击「深度」徽章/标题，当前页中央浮出报告全文，不跳转 ===== */
const rpModal = document.getElementById('rpModal');
const rpFrame = document.getElementById('rpFrame');
function openReport(href) {
  /* 目录路径补全为 index.html：file:// 直开不经过服务器，无法自动解析目录默认页 */
  const src = href.endsWith('/') ? href + 'index.html' : href;
  rpFrame.src = src;
  rpModal.hidden = false;
  document.body.style.overflow = 'hidden';   // 弹层期间锁定背景滚动
  document.getElementById('rpClose').focus();
}
function closeReport() {
  rpModal.hidden = true;
  rpFrame.src = 'about:blank';               // 关闭即卸载，停止报告页脚本/滚动位置
  document.body.style.overflow = '';
}
/* 委托：标题链接与「深度」徽章（href 均以 report/ 开头）统一走浮层 */
document.getElementById('opcGrid').addEventListener('click', (e) => {
  const link = e.target.closest('a[href^="report/"]');
  if (link) { e.preventDefault(); openReport(link.getAttribute('href')); }
});
rpModal.addEventListener('click', (e) => { if (e.target === rpModal) closeReport(); });
document.getElementById('rpClose').addEventListener('click', closeReport);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !rpModal.hidden) closeReport(); });
/* 报告与案例墙同源：加载后隐藏报告内的「返回案例墙」面包屑（浮层场景冗余） */
rpFrame.addEventListener('load', () => {
  try {
    const doc = rpFrame.contentDocument;
    if (doc && doc.head) {
      const s = doc.createElement('style');
      s.textContent = '.crumb{display:none}';
      doc.head.appendChild(s);
    }
  } catch {}
});
</script>
